<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הכלי עבר לכתובת חדשה</title>
<link rel="canonical" href="https://michrazpro.com/">
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;margin:40px 16px;text-align:center;background:#fff;color:#1d2321}a{color:#2e7d55}</style>
</head>
<body>
<p>כלי בחירת המגרשים עבר לכתובת חדשה: <a id="go" href="https://michrazpro.com/">michrazpro.com</a></p>
<script>
// מעביר לכתובת החדשה. הפול שנשמר בדפדפן בכתובת הישנה עובר איתו בפעם הראשונה (#s=..., כמו "קישור אישי").
var to = 'https://michrazpro.com/', h = location.hash;
if (h.indexOf('#s=') !== 0) {
  h = '';
  try {
    var s = localStorage.getItem('dror-tool');
    if (s && !localStorage.getItem('dror-moved') && (JSON.parse(s).pinned || []).length) {
      h = '#s=' + btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      localStorage.setItem('dror-moved', '1');
    }
  } catch (e) {}
}
document.getElementById('go').href = to + h;
location.replace(to + h);
</script>
</body>
</html>
